[project]
name = "statistics-practice"
version = "0.1.0"
requires-python = "==3.10.11"
dependencies = [
    "duckdb>=1.5.6",
    "requests>=2.34.2",
]

[project.optional-dependencies]
transit = [
    "pdfplumber>=0.11,<0.12",
    "beautifulsoup4>=4.12.3,<5",
]
app = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
social = [
    "jieba>=0.42.1,<0.43",
    "wordcloud>=1.9.4,<2",
]
web = [
    "playwright>=1.55,<2",
    "beautifulsoup4>=4.12.3,<5",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pygam>=0.10,<0.12",
    "scikit-learn>=1.7,<1.8",
    "scipy>=1.15.3",
    "xgboost>=3.1,<3.2",
]
notebook = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "pandas>=2.3.3",
]
